
stages:
  - build
  - test

build-code-job:
  stage: build
  script:
    - echo "Compile the bocl executable:"
    - printf '#define _POSIX_SOURCE\n#include <unistd.h>\n' > test.c
    - cpp -dM  test.c | sort
    - make bocl
  artifacts:
    paths:
      - src/bocl
    expire_in: 3 days

test-code-job:
  stage: test
  script:
    - echo "If the files are built successfully, run some tests:"
    - make test VERBOSE=
