default:
  image: debian

stages:
  - build
  - test

build-code-job:
  stage: build
  variables:
    DEFINES: -DGITLAB_CI=1
  script:
    - echo "Dump the environment:"
    - env | sort
    - printf '#define _POSIX_SOURCE\n#include <unistd.h>\n' > test.c
    - cpp -dM  test.c | sort
    - ls /usr/include/
    - ls /usr/local/include/
    - echo "Compile the bocl executable:"
    - make -k build DEFINES=${DEFINES}
  artifacts:
    paths:
      - sources/bocl
      - tests/test_reader
    expire_in: 3 days

test-code-job:
  stage: test
  variables:
    DEFINES: -DGITLAB_CI=1
  script:
    - echo "Dump the environment:"
    - env | sort
    - echo "If the files are built successfully, run some tests:"
    - make -k test DEFINES=${DEFINES} VERBOSE=

cunit:
  stage: test
  variables:
    DEFINES: -DGITLAB_CI=1
  script:
    - tests/test_reader
  artifacts:
    when: always
    reports:
      junit: tests/test_reader-cunit-test.xml
