# ======================================================================
# bocl CI — Phase 0-1: cached x86-64 toolchain images, build+test+package,
# artifact collection and tag-gated binary releases.
#
# Pipeline shape:
#   images   build the 3 toolchain images ONCE, push to the Container Registry,
#            reuse across pipelines (rebuilt only when ci/images/** changes).
#   build    per-environment: compile (exe + shared + static), run the CUnit
#            tests, prove the lib links from an independent driver, package a
#            relocatable tarball. Plus a separate ASan/UBSan sanitiser job.
#   collect  gather every environment's tarball, write SHA256SUMS, and on a v*
#            tag publish them to the generic Package Registry + a GitLab Release.
#
# Later phases (compiler matrix, QEMU cross-arch incl. big-endian/32-bit, BSD,
# native macOS/Windows) extend the `build` stage by adding jobs — no structural
# change to this file. The toolchain images carry CUnit + ccache; the deliverable
# targets (build / test / check-lib / dist) live in sources/ + tests/ Makefiles.
# ======================================================================

stages:
  - images
  - build
  - collect

variables:
  GIT_DEPTH: "20"
  REGISTRY_NS: "$CI_REGISTRY_IMAGE/ci"
  CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
  BUILD: "release"      # deliverable profile (overridable per job)
  COMPRESS: "zstd"      # dist tarball compression

# ----------------------------------------------------------------------
# Image builds (kaniko — no privileged runner needed on GitLab SaaS).
# Each toolchain image is tagged :latest and :<short-sha>. Rebuilt only when an
# image Dockerfile (or this file) changes, on schedules, or manually — otherwise
# the cached :latest is reused by every build job (the core of "cache the
# environments as much as possible").
# ----------------------------------------------------------------------
.docker:
  # Every containerised job (an `image:` job) carries the `docker` tag so it is
  # only picked by a DOCKER-executor runner (poseidon: bocl-linux-docker over
  # rootless docker).  Without tags, untagged SHELL runners grab these jobs and
  # fail them: kaniko has no /kaniko on a shell, the toolchain images are
  # ignored, and concurrent shell jobs share one /tmp.  The runner must have
  # the `docker` tag (and may keep run-untagged off).
  tags:
    - docker

.build-image:
  extends: .docker
  stage: images
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    IMG: ""          # set per job
    DOCKERFILE: ""   # set per job
  script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/$DOCKERFILE"
      --destination "$REGISTRY_NS/$IMG:latest"
      --destination "$REGISTRY_NS/$IMG:$CI_COMMIT_SHORT_SHA"
      --cache=true
      --cache-repo "$REGISTRY_NS/$IMG/cache"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # Bootstrap: on a brand-new branch's first pipeline the before-SHA is the
    # null SHA, so there is no cached :latest in the registry yet — build it.
    - if: '$CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
    - changes:
        - ci/images/**/*
        - .gitlab-ci.yml
    - when: manual
      allow_failure: true

image:debian-gcc:
  extends: .build-image
  variables: { IMG: "debian-gcc", DOCKERFILE: "ci/images/debian-gcc.Dockerfile" }

image:debian-clang:
  extends: .build-image
  variables: { IMG: "debian-clang", DOCKERFILE: "ci/images/debian-clang.Dockerfile" }

image:alpine-musl:
  extends: .build-image
  variables: { IMG: "alpine-musl", DOCKERFILE: "ci/images/alpine-musl.Dockerfile" }

image:debian-tcc:
  extends: .build-image
  variables: { IMG: "debian-tcc", DOCKERFILE: "ci/images/debian-tcc.Dockerfile" }

# ----------------------------------------------------------------------
# Build + test + package, one job per environment. ccache is persisted per-job
# across pipelines and engaged transparently by prepending its wrapper dir to
# PATH (CC stays the plain compiler name, keeping dist artifact names clean).
# ----------------------------------------------------------------------
.unix-build:
  extends: .docker
  stage: build
  before_script:
    - export PATH="/usr/lib/ccache:/usr/lib/ccache/bin:$PATH"
    - mkdir -p "$CCACHE_DIR"
    - ccache -z >/dev/null 2>&1 || true
  script:
    - sh ci/build.sh
    - sh ci/package.sh
  cache:
    key: "ccache-$CI_JOB_NAME"
    paths:
      - .ccache
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - dist/
    reports:
      junit: tests/*-Results.xml
    expire_in: 7 days
  rules:
    - when: on_success

# NOTE: build jobs intentionally do NOT `needs:` the image jobs. When the
# Dockerfiles are unchanged the image jobs are non-blocking manual actions, and
# a `needs:` on a present-but-manual job would SKIP the build job. Relying on
# stage ordering instead means: if an image job actually runs (bootstrap or
# ci/images change) the build stage waits for it; otherwise the build stage
# proceeds and pulls the cached :latest from the registry.
build:debian-gcc:
  extends: .unix-build
  image: "$REGISTRY_NS/debian-gcc:latest"

build:debian-clang:
  extends: .unix-build
  image: "$REGISTRY_NS/debian-clang:latest"

build:alpine-musl:
  extends: .unix-build
  image: "$REGISTRY_NS/alpine-musl:latest"

# tcc (TinyCC) — compiler-matrix stress: a non-GNU C17 compiler with none of the
# GNU/Clang builtins, so it guards against bocl regressing onto gcc/clang-only
# intrinsics. Build + CUnit tests + static/shared linkage proof (via ci/build.sh,
# CC=tcc from the image); no packaging — tcc output is not a shipping deliverable.
build:debian-tcc:
  extends: .docker
  stage: build
  image: "$REGISTRY_NS/debian-tcc:latest"
  script:
    - sh ci/build.sh
  artifacts:
    reports:
      junit: tests/*-Results.xml
    expire_in: 3 days
  rules:
    # Blocking since the error(3) symbol collision was fixed (v1.8.47,
    # issues/closed/tcc-lane-test-crash.issue): the crashes were libbocl's
    # exported `error` binding to glibc's error(3) through tcc's NEEDED
    # order, not a tcc miscompilation.
    - when: on_success

# Sanitiser build — ASan + the wider -fsanitize=* set (common.mk SANITIZE=yes).
# Kept separate (no packaging) so a default failure is distinguishable from a
# sanitiser hit. Debug profile: -fsanitize=object-size needs >-O0 disabled.
sanitise:debian-gcc:
  extends: .docker
  stage: build
  image: "$REGISTRY_NS/debian-gcc:latest"
  script:
    - make -k build SANITIZE=yes BUILD=debug
    - make -k -C tests test SANITIZE=yes BUILD=debug
  artifacts:
    when: always
    reports:
      junit: tests/*-Results.xml
    expire_in: 3 days
  rules:
    - when: on_success

# Phase 4 — FreeBSD via QEMU. The BSDs cannot run in a container, so this boots
# a FreeBSD cloud image under QEMU and runs the normal ci/build.sh over SSH with
# gmake. On poseidon the runner passes /dev/kvm through (config.toml devices +
# udev MODE 0666, see issues/closed/freebsd-kvm-runner.issue) so the VM runs
# under KVM and the whole job takes ~15-20 min; without /dev/kvm the script
# falls back to TCG, where the FreeBSD 14.4 firstboot alone can exceed the
# timeout. Serial console is saved as an artifact for diagnosis.
build:freebsd:
  extends: .docker
  stage: build
  image: debian:bookworm-slim
  timeout: 1h30m
  script:
    - sh ci/freebsd-build.sh
  artifacts:
    when: always
    paths:
      - console.log
    expire_in: 3 days
  rules:
    # Blocking again since freebsd-latent-gc-corruption.issue was fixed
    # (v1.8.60): valid_block_start_p now rejects non-word-aligned block sizes,
    # so the minor-GC mark no longer follows a stray interior pointer whose
    # objcount field aliased a real cons's SIZE on the 64-bit-header build.
    - when: on_success

# Phase 4 — native macOS on the thalassa shell runner. macOS cannot run in a
# container, so jobs that must run on macOS carry the `macos` runner tag and
# execute directly on the host; `.macos` is the shared anchor that selects the
# thalassa runner — any future macOS job just `extends: .macos`. The host
# provides the toolchain (Apple clang) directly, so there is no ccache PATH shim
# and no toolchain image. thalassa is intermittent (it is not always online), so
# the build job is allow_failure: it reports native-macOS portability status
# without blocking the deliverable pipeline when the runner is offline.
.macos:
  tags:
    - macos

build:macos:
  extends: .macos
  stage: build
  variables:
    # macOS base ships gzip but not zstd; gzip keeps packaging dependency-free.
    # (This job is not gathered by collect, so it needs no release compressor.)
    COMPRESS: "gzip"
  script:
    - sh ci/build.sh
    - sh ci/package.sh
  artifacts:
    name: "$CI_JOB_NAME"
    when: always
    paths:
      - dist/
    reports:
      junit: tests/*-Results.xml
    expire_in: 7 days
  rules:
    - when: on_success
      allow_failure: true

# ----------------------------------------------------------------------
# Collect every environment's tarball, write a combined SHA256SUMS, and on a
# v* tag upload the set to the generic Package Registry and cut a Release.
# ----------------------------------------------------------------------
collect:
  extends: .docker
  stage: collect
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - { job: "build:debian-gcc", artifacts: true }
    - { job: "build:debian-clang", artifacts: true }
    - { job: "build:alpine-musl", artifacts: true }
  script:
    - apk add --no-cache curl >/dev/null 2>&1 || true
    - mkdir -p release && cp dist/* release/ 2>/dev/null || true
    - cd release
    - 'sha256sum *.tar.* > SHA256SUMS 2>/dev/null || shasum -a 256 *.tar.* > SHA256SUMS'
    - cat SHA256SUMS
    - cd ..
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        ASSET_ARGS=""
        for f in release/*.tar.zst release/*.tar.gz release/*.tar.xz; do
          [ -e "$f" ] || continue
          bn=$(basename "$f")
          url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/bocl/$CI_COMMIT_TAG/$bn"
          echo "uploading $bn -> $url"
          curl --fail --silent --show-error \
               --header "JOB-TOKEN: $CI_JOB_TOKEN" \
               --upload-file "$f" "$url"
          ASSET_ARGS="$ASSET_ARGS --assets-link {\"name\":\"$bn\",\"url\":\"$url\"}"
        done
        eval release-cli create \
          --name "bocl $CI_COMMIT_TAG" \
          --tag-name "$CI_COMMIT_TAG" \
          --description "Automated binary release of bocl ${CI_COMMIT_TAG}. SHA256SUMS in the collect job artifacts." \
          $ASSET_ARGS
      fi
  artifacts:
    name: "bocl-release"
    paths:
      - release/
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: always
